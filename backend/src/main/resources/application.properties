spring.application.name=style-scent-engine

# El backend corre en el mismo servidor Linux que el contenedor MySQL,
# por eso es localhost y no 192.168.1.41
spring.datasource.url=jdbc:mysql://localhost:3307/style_scent?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3307/style_scent
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate en vez de update/create: las tablas ya existen y las creaste tú
# a mano con SQL. Con "validate" Hibernate solo comprueba que las entidades
# coincidan con el esquema real; nunca lo modifica por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true