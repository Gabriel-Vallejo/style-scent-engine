spring.application.name=style-scent-engine

# Credenciales: se leen de backend/.env (el mismo fichero que usa docker compose,
# no versionado; ver .env.example). DB_USERNAME / DB_PASSWORD exportadas en la
# shell tienen prioridad si existen.
spring.config.import=optional:file:.env[.properties]

# El backend corre en el mismo servidor Linux que el contenedor MySQL,
# por eso es localhost y no la IP de la red local
spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE:style_scent}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate en vez de update/create: el esquema vive en database/01-schema.sql.
# Con "validate" Hibernate solo comprueba que las entidades coincidan con el
# esquema real; nunca lo modifica por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Microservicio de visión (vision-service/, Fase 2)
vision.url=${VISION_URL:http://localhost:8001}
# Las fotos del móvil pueden pesar varios MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
