services:
  db:
    image: mysql:8.0
    container_name: style_scent_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Solo accesible desde este servidor (el backend corre aquí); para
      # conectarte desde otro equipo usa un túnel SSH: ssh -L 3307:localhost:3307
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Esquema + datos iniciales; MySQL solo los ejecuta si db_data está vacío
      - ./database:/docker-entrypoint-initdb.d:ro

  vision:
    build: ./vision-service
    container_name: style_scent_vision
    restart: always
    ports:
      # Solo lo usa el backend, que corre en este mismo servidor
      - "127.0.0.1:8001:8001"

  backend:
    build: ./backend
    container_name: style_scent_backend
    restart: always
    # Si el esquema aún no está cargado, Hibernate (validate) falla y Docker reintenta
    depends_on:
      - db
      - vision
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      VISION_URL: http://vision:8001
      # Sin esto cada consulta va al log de Docker, que no rota y llena el disco
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      # Público: es lo que usa la app móvil. Con HTTPS (Caddy) cámbialo a 127.0.0.1:8080
      - "8080:8080"

volumes:
  db_data: